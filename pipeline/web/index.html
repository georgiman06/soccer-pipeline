<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Soccer Pipeline — 2D Field Test Bench</title>
<style>
  :root {
    --bg: #0f1317; --panel: #171d23; --panel2: #1c242c; --line: #2a343e;
    --text: #d8dee4; --muted: #8b98a5; --accent: #4da3ff;
    --ok: #3ecf6f; --warn: #ffb020; --bad: #ff5d5d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 16px; background: var(--panel); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; color: var(--accent); white-space: nowrap; }
  select, button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; font-size: 13px; cursor: pointer; }
  button:hover { background: #242e38; border-color: #3a4652; }
  button:disabled { opacity: 0.45; cursor: default; }
  label { font-size: 13px; display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--muted); }
  main { flex: 1; display: flex; gap: 12px; padding: 12px; overflow: hidden; }
  #videoPane { flex: 1.35; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 8px; min-width: 0; position: relative; border: 1px solid var(--line); }
  #frame { max-width: 100%; max-height: 100%; display: block; }
  #overlay { position: absolute; pointer-events: none; }
  #mapPane { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--panel); border-radius: 8px; min-width: 0; border: 1px solid var(--line); }
  #pitch { max-width: 100%; max-height: 100%; }
  footer { padding: 10px 16px 14px; background: var(--panel); border-top: 1px solid var(--line); }
  #slider { width: 100%; accent-color: var(--accent); }
  #status { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; min-height: 24px; align-items: center; }
  .chip { background: var(--panel2); border: 1px solid var(--line); color: var(--muted); font-size: 12px; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .chip.ok { color: var(--ok); border-color: rgba(62,207,111,.4); }
  .chip.warn { color: var(--warn); border-color: rgba(255,176,32,.45); }
  .chip.bad { color: var(--bad); border-color: rgba(255,93,93,.45); }
  .chip.info { color: var(--accent); border-color: rgba(77,163,255,.4); }
  .legend { display: flex; gap: 13px; font-size: 12px; margin-top: 8px; color: var(--muted); flex-wrap: wrap; align-items: center; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>Soccer Pipeline</h1>
  <select id="seqSel"></select>
  <button id="prevBtn">&#9664;</button>
  <button id="playBtn">Play</button>
  <button id="nextBtn">&#9654;</button>
  <button id="precompBtn">Precompute clip</button>
  <button id="precompAllBtn">Precompute ALL</button>
  <label><input type="checkbox" id="markToggle" checked> Markers</label>
  <label><input type="checkbox" id="gtToggle" checked> Ground truth</label>
  <label><input type="checkbox" id="overlayToggle" checked> Pitch lines</label>
  <label><input type="checkbox" id="idToggle"> IDs</label>
  <select id="speedSel" title="playback speed">
    <option value="80">0.5x</option>
    <option value="40" selected>1x</option>
    <option value="20">2x</option>
  </select>
</header>
<main>
  <div id="videoPane">
    <img id="frame" alt="frame">
    <canvas id="overlay"></canvas>
  </div>
  <div id="mapPane"><canvas id="pitch" width="640" height="440"></canvas></div>
</main>
<footer>
  <input type="range" id="slider" min="1" max="750" value="1">
  <div id="status"><span class="chip">loading...</span></div>
  <div class="legend">
    <span><span class="sw" id="swTeam0" style="background:#fff"></span><span id="lblTeam0">team 1 (auto)</span></span>
    <span><span class="sw" id="swTeam1" style="background:#fff"></span><span id="lblTeam1">team 2 (auto)</span></span>
    <span><span class="sw" style="background:transparent;border:2px solid #fff;width:6px;height:6px"></span>player (GT)</span>
    <span><span class="sw" style="background:#ffb020"></span>ball</span>
    <span><span class="sw" style="background:transparent;border:2px solid #ffb020;width:6px;height:6px"></span>ball (GT)</span>
    <span><span class="sw" style="background:transparent;border:2px dashed #ff4dd2;width:6px;height:6px;border-radius:0"></span>pitch lines (calib)</span>
  </div>
</footer>
<script>
const $ = id => document.getElementById(id);
let seqs = [], seq = null, idx = 1, playing = false, busy = false, pending = null;
let precomputed = {};
let teamColors = [null, null];
let lastAdv = 0, avgDt = 0;  // measured frame-advance interval -> live speed readout

function updateTeamColors(colors) {
  if (!Array.isArray(colors) || colors.length !== 2 || colors.some(c => typeof c !== 'string')) return;
  teamColors = colors;
  $('swTeam0').style.background = colors[0];
  $('swTeam1').style.background = colors[1];
}

function playerColor(p) {
  if ((p.team === 0 || p.team === 1) && teamColors[p.team]) return teamColors[p.team];
  return '#ffffff'; // unclassified (GK / ref) or legacy cache entry without teams
}

function startPrecompute() {
  if (!seq) return;
  if (precomputed[seq] === 'done') { $('status').innerHTML = '<span class="chip ok">clip already precomputed — press Play</span>'; return; }
  $('precompBtn').disabled = true;
  $('status').innerHTML = '<span class="chip info">precompute started...</span>';
  fetch(`/api/precompute/${seq}`, { method: 'POST' }).then(() => pollProgress());
}

function pollProgress() {
  fetch(`/api/progress/${seq}`)
    .then(r => r.json())
    .then(p => {
      if (p.total > 0) $('status').innerHTML = `<span class="chip info">precomputing ${p.done}/${p.total} frames (~${Math.max(0, Math.round((p.total - p.done) * 3 / 60))} min left)</span>`;
      if (p.finished) {
        precomputed[seq] = 'done';
        $('precompBtn').disabled = false;
        $('precompBtn').textContent = 'Precompute clip';
        $('status').innerHTML = '<span class="chip ok">clip ready — press Play</span>';
      } else {
        setTimeout(() => pollProgress(), 3000);
      }
    })
    .catch(() => setTimeout(() => pollProgress(), 5000));
}

fetch('/api/sequences').then(r => r.json()).then(s => {
  seqs = s;
  $('seqSel').innerHTML = s.map(x => `<option>${x}</option>`).join('');
  seq = s[0];
  load();
  // reflect caches + any background queue that is already running
  fetch('/api/queue_status').then(r => r.json()).then(q => {
    for (const c of q.clips) if (c.finished) precomputed[c.seq] = 'done';
    if (q.running) { $('precompAllBtn').disabled = true; pollQueue(); }
  }).catch(() => {});
});

let queuePolling = false;
function pollQueue() {
  fetch('/api/queue_status').then(r => r.json()).then(q => {
    const cur = q.clips.find(c => !c.finished);
    if (q.running && cur) {
      queuePolling = true;
      $('status').innerHTML = `<span class="chip info">bg precompute: ${cur.seq} ${cur.done}/${cur.total}</span><span class="chip">${q.queued.length} clips queued</span>`;
      if (cur.seq === seq && cur.done >= idx) precomputed[seq] = 'done';
      setTimeout(pollQueue, 3000);
    } else {
      queuePolling = false;
      $('precompAllBtn').disabled = false;
      if (playing) return;
      $('status').innerHTML = '<span class="chip ok">background precompute finished — all clips ready</span>';
      for (const s of seqs) precomputed[s] = 'done';
    }
  }).catch(() => setTimeout(pollQueue, 5000));
}

function precomputeAll() {
  if (!confirm('Precompute ALL clips? ~30 min each — runs in the background for hours (resumable; finished clips are skipped). Continue?')) return;
  $('precompAllBtn').disabled = true;
  fetch('/api/precompute_all', { method: 'POST' }).then(r => r.json()).then(d => {
    $('status').innerHTML = d.queued
      ? `<span class="chip info">queued ${d.queued} clips for background precompute</span>`
      : '<span class="chip ok">all clips already precomputed</span>';
    if (d.queued) pollQueue();
  });
}
$('precompAllBtn').onclick = precomputeAll;

function load() {
  busy = true;
  const reqIdx = idx;
  $('status').innerHTML = `<span class="chip info">processing frame ${reqIdx} ...</span>`;
  $('frame').src = `/api/frame/${seq}/${reqIdx}`;
  fetch(`/api/process/${seq}/${reqIdx}`)
    .then(r => r.json())
    .then(d => {
      if (reqIdx !== idx || d.error) { busy = false; if (d.error) $('status').innerHTML = `<span class="chip bad">frame ${reqIdx}: ${d.error}</span>`; return; }
      pending = d; render(); busy = false; statusChips(d);
    })
    .catch(() => { busy = false; $('status').innerHTML = `<span class="chip bad">error processing frame ${reqIdx}</span>`; });
}

function statusChips(d) {
  const chip = (label, cls = '') => `<span class="chip ${cls}">${label}</span>`;
  const b = d.ball ? (d.ball.coasting ? 'ball coasting' : `ball ${d.ball.conf}`) : 'ball —';
  const calibCls = d.calib_source === 'model' ? 'ok' : (d.calib_source === 'frozen' || d.calib_source === 'none') ? 'bad' : 'warn';
  const hq = d.h_quality != null
    ? chip(`map ${Math.round(d.h_quality * 100)}%`, d.h_quality > 0.7 ? 'ok' : d.h_quality >= 0.4 ? 'warn' : 'bad')
    : '';
  const reacq = d.calib_source === 'frozen' || d.calib_source === 'held' ? chip('REACQUIRING', 'warn') : '';
  let speed = '';
  if (playing && avgDt > 0) {
    const fps = 1000 / avgDt;
    speed = chip(`${fps.toFixed(1)} fps (${Math.min(fps / 25, 9.99).toFixed(2)}x)`, 'info');
  }
  const teams = teamColors[0] && teamColors[1] ? chip('teams locked', 'ok') : '';
  const k = d.kpts ? `${d.kpts.visible}/${d.kpts.total}` : '?';
  $('status').innerHTML =
    chip(`frame ${d.idx}`) +
    chip(`players ${d.players.length} · GT ${d.gt.players_img.length}`) +
    chip(b) +
    chip(`kpts ${k}`) +
    chip(`calib ${d.calib_source}`, calibCls) +
    teams + hq + reacq + speed;
}

function drawPitch() {
  const c = $('pitch'), ctx = c.getContext('2d');
  const W = 105, H = 68, m = 6, s = Math.min((c.width - 2 * m) / W, (c.height - 2 * m) / H);
  const X = (x) => m + (x + 2.5) * s, Y = (y) => m + (y + 2.5) * s;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#1e7a34';
  ctx.fillRect(X(0), Y(0), W * s, H * s);
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5;
  ctx.strokeRect(X(0), Y(0), W * s, H * s);
  ctx.beginPath(); ctx.moveTo(X(52.5), Y(0)); ctx.lineTo(X(52.5), Y(68)); ctx.stroke();
  ctx.beginPath(); ctx.arc(X(52.5), Y(34), 9.15 * s, 0, 2 * Math.PI); ctx.stroke();
  for (const side of [[0, 1], [105, -1]]) {
    const [gx, dir] = side;
    ctx.strokeRect(X(Math.min(gx, gx + 16.5 * dir)), Y(13.84), 16.5 * s, 40.32 * s);
    ctx.strokeRect(X(Math.min(gx, gx + 5.5 * dir)), Y(24.84), 5.5 * s, 18.32 * s);
    ctx.strokeRect(X(Math.min(gx, gx + 2 * dir)), Y(34 - 3.66), 2 * s, 7.32 * s);
  }
  return { X, Y };
}

function dot(ctx, p, X, Y, color, r, hollow) {
  const x = X(p[0]), y = Y(p[1]);
  if (!isFinite(x) || !isFinite(y)) return;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, 2 * Math.PI);
  if (hollow) { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke(); }
  else { ctx.fillStyle = color; ctx.fill(); }
}

function inField(p) { return p && p[0] > -3 && p[0] < 108 && p[1] > -3 && p[1] < 71; }

function render() {
  const d = pending; if (!d) return;
  updateTeamColors(d.team_colors);
  const { X, Y } = drawPitch();
  const ctx = $('pitch').getContext('2d');
  const showGT = $('gtToggle').checked;

  if (showGT) {
    for (const p of d.gt.players_pitch) if (inField(p)) dot(ctx, p, X, Y, '#ffffff', 4.5, true);
    for (const p of d.gt.ball_pitch) if (inField(p)) dot(ctx, p, X, Y, '#ffb020', 4, true);
  }
  const frozenMode = d.calib_source === 'frozen';
  for (const p of d.players) if (p.pitch && inField(p.pitch)) {
    ctx.globalAlpha = p.coasting ? 0.5 : (frozenMode ? 0.75 : 1.0);
    dot(ctx, p.pitch, X, Y, playerColor(p), 4, false);
    if ($('idToggle').checked) {
      ctx.fillStyle = '#e8eef2';
      ctx.font = '10px Segoe UI';
      ctx.fillText('#' + p.id, X(p.pitch[0]) + 6, Y(p.pitch[1]) - 5);
    }
  }
  ctx.globalAlpha = 1.0;
  if (d.ball && d.ball.pitch && inField(d.ball.pitch)) {
    dot(ctx, d.ball.pitch, X, Y, d.ball.coasting ? '#808080' : '#ffb020', 5.5, false);
  }
  drawOverlay($('overlayToggle').checked);
}

function drawOverlay(showLines) {
  const img = $('frame'), cv = $('overlay');
  if (!img.naturalWidth) { requestAnimationFrame(() => drawOverlay(showLines)); return; }
  const scale = img.clientWidth / img.naturalWidth;
  cv.width = img.clientWidth; cv.height = img.clientHeight;
  cv.style.left = img.offsetLeft + 'px'; cv.style.top = img.offsetTop + 'px';
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  const d = pending;
  if (!d) return;

  if (showLines && d.overlay_lines) {
    ctx.strokeStyle = 'rgba(255,77,210,0.9)'; ctx.lineWidth = 1.5;
    for (const line of d.overlay_lines) {
      ctx.beginPath();
      ctx.moveTo(line[0][0] * scale, line[0][1] * scale);
      ctx.lineTo(line[1][0] * scale, line[1][1] * scale);
      ctx.stroke();
    }
  }

  if (!$('markToggle').checked) return;
  const frozenMode = d.calib_source === 'frozen';
  // team-colored foot markers, sized by camera depth (lower in frame = closer)
  for (const p of d.players) {
    if (!p.img) continue;
    const t = Math.min(1, Math.max(0, p.img[1] / img.naturalHeight));
    const rx = Math.max(6, img.clientWidth * (0.008 + 0.014 * t));
    const x = p.img[0] * scale, y = p.img[1] * scale;
    ctx.globalAlpha = p.coasting ? 0.45 : (frozenMode ? 0.8 : 1.0);
    ctx.strokeStyle = playerColor(p);
    ctx.lineWidth = Math.max(2, rx * 0.16);
    ctx.beginPath();
    ctx.ellipse(x, y, rx, rx * 0.38, 0, 0, 2 * Math.PI);
    ctx.stroke();
    if ($('idToggle').checked) {
      ctx.fillStyle = '#ffffff';
      ctx.font = `600 ${Math.max(10, rx * 0.55)}px Segoe UI`;
      ctx.textAlign = 'center';
      ctx.fillText('#' + p.id, x, y - rx * 0.75);
      ctx.textAlign = 'left';
    }
  }
  // ball marker
  if (d.ball && d.ball.img) {
    const t = Math.min(1, Math.max(0, d.ball.img[1] / img.naturalHeight));
    const r = Math.max(4, img.clientWidth * (0.004 + 0.006 * t));
    ctx.globalAlpha = d.ball.coasting ? 0.45 : 1.0;
    ctx.strokeStyle = '#ffb020';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(d.ball.img[0] * scale, d.ball.img[1] * scale, r, 0, 2 * Math.PI);
    ctx.stroke();
  }
  ctx.globalAlpha = 1.0;
}

$('seqSel').onchange = e => { seq = e.target.value; idx = 1; $('slider').value = 1; lastAdv = 0; avgDt = 0; load(); };
$('slider').oninput = e => { idx = +e.target.value; if (!busy) load(); };
$('prevBtn').onclick = () => { if (idx > 1) { idx--; $('slider').value = idx; if (!busy) load(); } };
$('nextBtn').onclick = () => { if (idx < 750) { idx++; $('slider').value = idx; if (!busy) load(); } };
$('playBtn').onclick = () => {
  playing = !playing;
  $('playBtn').textContent = playing ? 'Pause' : 'Play';
  if (playing) { lastAdv = 0; avgDt = 0; tick(); }
};
function tick() {
  if (!playing) return;
  const fpsMode = precomputed[seq] === 'done';
  if (!busy && idx < 750) {
    const now = performance.now();
    if (lastAdv) { const dt = now - lastAdv; avgDt = avgDt ? 0.8 * avgDt + 0.2 * dt : dt; }
    lastAdv = now;
    idx++;
    $('slider').value = idx;
    load();
  }
  setTimeout(tick, fpsMode ? +$('speedSel').value : 120);
}
$('gtToggle').onchange = render;
$('idToggle').onchange = render;
$('overlayToggle').onchange = () => drawOverlay($('overlayToggle').checked);
$('markToggle').onchange = () => drawOverlay($('overlayToggle').checked);
window.onresize = () => drawOverlay($('overlayToggle').checked);
</script>
</body>
</html>
